<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PulseChat | Profile</title>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../styles/landing-page.css">
        <link rel="stylesheet" href="../styles/profile.css">
    </head>

    <body>
        <main class="login-container">

            <section class="login-form" id="profile">

                <img src="../assets/images/placeholder.png" alt="Profile Avatar" class="large-avatar">
                <div class="status">
                    <span id="profile-status-dot"></span>
                    <span class="status-text">Online</span>
                </div>

                <span class="label">Username:</span>
                <span id="current-username"></span>

                <form class="edit-username">
                    <input type="text" id="new-username" class="input-field" placeholder="Enter new username" required/>
                    <input type="submit" class="button" id="wide-btn" value="Change Username">
                </form>

                <a href="home.html" class="button" id="home-button">Home</a>
                
            </section>

        </main>
    </body>
</html>
