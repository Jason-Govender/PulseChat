<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PulseChat | Register</title>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../styles/landing-page.css">
        <link rel="stylesheet" href="../styles/sign-up.css">
    </head>
    <body>
        <main class="login-container">
            <form class="login-form" id="registration-form" method="POST">
                <header class="form-header">Create An Account</header>
                <label for="username">Username:</label>
                <input type="text" class="input-field" id="username" name="username" required>
                <label for="password">Password:</label>
                <input id="password" class="input-field" name="password" type="password" required>
                <input type="submit" class="button" value="Register">
                <a href="../index.html" class="auth-page-link">Have An Account? Login</a>
            </form>
        </main>
    </body>
    <script src="../js/sign-up.js"></script>
</html>
