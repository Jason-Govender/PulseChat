<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PulseChat | Login</title>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles/landing-page.css">
    </head>

    <body>
        <img src="assets/images/logo.png" class="logo" alt="PulseChat logo"/>
        <main class="login-container">
            <form class="login-form" id="login-form" method="POST">
                <header class="form-header">Login</header>
                <label for="username">Username:</label>
                <input type="text" class="input-field" id="username" name="username" required>
                <label for="password">Password:</label>
                <input id="password" class="input-field" name="password"type="password" required>
                <input type="submit" class="button" value="Login">
                <a href="pages/sign-up.html" class="auth-page-link">Create Account</a>
            </form>
        </main>
    </body>
    <script src="js/landing-page.js"></script>
</html>
